plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    bundleCore
    bundleWin
    bundleLinux
    bundleMac
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        def pMc = project.findProperty('parchment_mc_version') ?: project.minecraft_version
        def pVer = project.findProperty('parchment_version') ?: ''
        if (pVer) {
            parchment("org.parchmentmc.data:parchment-${pMc}:${pVer}@zip")
        }
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"

    def osClassifier = rootProject.ext.getOsClassifier()
    runtimeOnly "org.bytedeco:javacv:${rootProject.ext.javacvVersion}"
    runtimeOnly "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:${osClassifier}"
    runtimeOnly "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:${osClassifier}"

    bundleCore "org.bytedeco:javacv:${rootProject.ext.javacvVersion}"
    bundleWin "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:windows-x86_64"
    bundleWin "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:windows-x86_64"
    bundleLinux "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:linux-x86_64"
    bundleLinux "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:linux-x86_64"
    bundleMac "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:macosx-x86_64"
    bundleMac "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:macosx-x86_64"
}

loom {
    runs {
        client {
            client()
            runDir "run"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.properties rootProject.ext.modProperties
    filesMatching('fabric.mod.json') {
        expand rootProject.ext.modProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-fabric-dev.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
}

tasks.named('remapJar').configure {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-fabric.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    if (file("LICENSE").exists()) {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }
}

def createMultiOsJar = { String targetOsSuffix, String configName ->
    tasks.register("buildJar${targetOsSuffix.capitalize()}", Jar) {
        dependsOn tasks.remapJar
        group = 'build'
        description = "Собирает Fabric JAR с встроенными библиотеками для ${targetOsSuffix}"
        archiveFileName.set("${project.archives_base_name}-${project.mod_version}-fabric-${targetOsSuffix}.jar")
        destinationDirectory.set(layout.buildDirectory.dir("libs"))
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from(zipTree(tasks.remapJar.archiveFile)) {
            exclude 'META-INF/MANIFEST.MF'
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.DSA'
            exclude 'META-INF/*.RSA'
        }
        from {
            (configurations.getByName(configName) + configurations.bundleCore).collect {
                it.isDirectory() ? it : project.zipTree(it)
            }
        }
    }
}

createMultiOsJar('win', 'bundleWin')
createMultiOsJar('linux', 'bundleLinux')
createMultiOsJar('macos', 'bundleMac')

tasks.register('buildAllOs') {
    group = 'build'
    dependsOn 'buildJarWin', 'buildJarLinux', 'buildJarMacos'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-AmodLoaderTarget=fabric"
}
