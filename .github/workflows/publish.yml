name: Cobe

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-all-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "VERSION=${VERSION:-1.0-SNAPSHOT}" >> $GITHUB_ENV

      - name: Publish for Linux
        run: ./gradlew publish -Ppublishing-dir=build/repo -Pmod_version=${{ env.VERSION }} -Pos=linux

      - name: Publish for Windows
        run: ./gradlew publish -Ppublishing-dir=build/repo -Pmod_version=${{ env.VERSION }} -Pos=win

      - name: Publish for macOS
        run: ./gradlew publish -Ppublishing-dir=build/repo -Pmod_version=${{ env.VERSION }} -Pos=macos

      - name: Deploy to Maven branch
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo
          branch: maven
          clean: false