name: Cobe

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64

      - name: Download and extract Windows JDK
        run: |
          mkdir -p java_d/winjava
          curl -L -o winjdk.zip "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_windows_hotspot_17.0.20.1_1.zip"
          unzip -q winjdk.zip -d java_d/winjava
          if [ -d "java_d/winjava/jdk-17.0.20.1+1" ]; then
            mv java_d/winjava/jdk-17.0.20.1+1/* java_d/winjava/
            rmdir java_d/winjava/jdk-17.0.20.1+1
          fi
          rm winjdk.zip
          ls -la java_d/winjava/

      - name: Determine Version from Branch Name
        run: |
          VERSION="${GITHUB_REF_NAME}-SNAPSHOT"
          echo "COBE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Publishing version: ${VERSION}"

      - name: Build fabric
        run: ./gradlew build -Pdbuild.loader=fabric -Pmod_version=${{ env.COBE_VERSION }}

      - name: Build forge
        run: ./gradlew build -Pdbuild.loader=forge -Pmod_version=${{ env.COBE_VERSION }}

      - name: Collect fabric artifacts
        run: |
          mkdir -p build/repo/fabric
          SRC=$(find build -type f -name '*-fabric-dev.jar' | head -n1)
          if [ -z "$SRC" ]; then
            echo "=== Debug: all jars in build/ ==="
            find build -name "*.jar" -type f
            echo "No dev jar found for fabric!" && exit 1
          fi
          cp -v "$SRC" "build/repo/fabric/cobe-fabric-${COBE_VERSION}.jar"
          cat > "build/repo/fabric/cobe-fabric-${COBE_VERSION}.pom" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>v.akfz</groupId>
            <artifactId>cobe-fabric</artifactId>
            <version>${COBE_VERSION}</version>
            <packaging>jar</packaging>
          </project>
          EOF
          ls -la build/repo/fabric/

      - name: Collect forge artifacts
        run: |
          mkdir -p build/repo/forge
          SRC=$(find build -type f -name '*-forge-dev.jar' | head -n1)
          if [ -z "$SRC" ]; then
            echo "=== Debug: all jars in build/ ==="
            find build -name "*.jar" -type f
            echo "No dev jar found for forge!" && exit 1
          fi
          cp -v "$SRC" "build/repo/forge/cobe-forge-${COBE_VERSION}.jar"
          cat > "build/repo/forge/cobe-forge-${COBE_VERSION}.pom" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>v.akfz</groupId>
            <artifactId>cobe-forge</artifactId>
            <version>${COBE_VERSION}</version>
            <packaging>jar</packaging>
          </project>
          EOF
          ls -la build/repo/forge/

      - name: Deploy fabric to maven
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo/fabric
          branch: maven
          target-folder: v/akfz/cobe-fabric/${{ env.COBE_VERSION }}
          clean: true

      - name: Deploy forge to maven
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo/forge
          branch: maven
          target-folder: v/akfz/cobe-forge/${{ env.COBE_VERSION }}
          clean: true