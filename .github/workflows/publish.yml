name: Cobe

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: set_version
        run: |
          # Извлекаем версию из gradle.properties (убираем возможные \r для совместимости)
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION="1.0-SNAPSHOT"
          fi
          echo "COBE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Publishing version: ${VERSION}"

      - name: Build and Publish All Modules to local folder
        run: ./gradlew publish -Ppublishing-dir=build/repo -Pmod_version=${{ env.COBE_VERSION }}

      - name: Deploy Maven to branch
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo
          branch: maven
          clean: false