buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:${project.mixingradle_version}"
    }
}

ext {
    getOsClassifier = {
        def os = System.getProperty("os.name").toLowerCase()
        def arch = System.getProperty("os.arch").toLowerCase()
        def isArm = arch.contains("arm") || arch.contains("aarch64")
        if (os.contains("win")) return "windows-x86_64"
        if (os.contains("mac")) return isArm ? "macosx-arm64" : "macosx-x86_64"
        if (os.contains("nix") || os.contains("nux") || os.contains("aix")) return isArm ? "linux-arm64" : "linux-x86_64"
        return "linux-x86_64"
    }
    getOsSuffix = {
        def os = System.getProperty("os.name").toLowerCase()
        if (os.contains("win")) return "win"
        if (os.contains("mac")) return "macos"
        if (os.contains("nix") || os.contains("nux")) return "linux"
        return "unknown"
    }
    javacvVersion = "1.5.10"
    ffmpegVersion = "6.1.1-${javacvVersion}"
}

ext.modProperties = [
        version: project.mod_version,
        loader_version: project.fabric_loader_version,
        minecraft_version: project.minecraft_version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_description: project.mod_description,
        mod_authors: project.mod_authors,
        mod_license: project.mod_license,
        mod_homepage: project.mod_homepage,
        mod_issues: project.mod_issues,
        mod_icon: project.mod_icon,
        forge_version: project.findProperty('forge_version') ?: '',
        neoforge_version: project.findProperty('neoforge_version') ?: ''
]

allprojects {
    apply plugin: 'java'
    def javaVer = Integer.parseInt(project.findProperty('java_version') ?: '17')
    java {
        sourceCompatibility = JavaVersion.toVersion(javaVer)
        targetCompatibility = JavaVersion.toVersion(javaVer)
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVer)
        }
    }
    version = project.mod_version
    group = project.maven_group
}

subprojects {
    def javaVer = Integer.parseInt(project.findProperty('java_version') ?: '17')

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = javaVer
    }

    tasks.processResources {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    configurations {
        embed
        implementation.extendsFrom(embed)
    }

    def javacvVersion = "1.5.10"
    def ffmpegVersion = "6.1.1-${javacvVersion}"
    def osClassifier = rootProject.ext.getOsClassifier()

    repositories {
        mavenCentral()
        if (project.hasProperty('aslib_version') && project.aslib_version) {
            maven { url = 'https://raw.githubusercontent.com/Akfz/AsLib/maven/' }
        }
        if (project.hasProperty('dbuild_version') && project.dbuild_version) {
            maven { url = 'https://raw.githubusercontent.com/Akfz/DBuild/maven/' }
        }
        maven { url = 'https://oss.sonatype.org/content/repositories/releases/' }
    }

    dependencies {
        if (project.hasProperty('aslib_version') && project.aslib_version) {
            implementation "v.akfz:aslib-${project.name}:${project.aslib_version}"
            annotationProcessor "v.akfz:aslib-${project.name}:${project.aslib_version}"
        }
        if (project.hasProperty('dbuild_version') && project.dbuild_version) {
            compileOnly "v.akfz:DBuild:${project.dbuild_version}"
            annotationProcessor "v.akfz:DBuild:${project.dbuild_version}"
        }
        compileOnly "org.bytedeco:javacv:${javacvVersion}"
        compileOnly "org.bytedeco:ffmpeg:${ffmpegVersion}"
        if (project.name != 'common') {
            implementation "org.bytedeco:javacpp:${javacvVersion}:${osClassifier}"
            implementation "org.bytedeco:ffmpeg:${ffmpegVersion}:${osClassifier}"
        }
    }

    if (project.name != 'common') {
        evaluationDependsOn(':common')
        sourceSets.main.java.srcDirs += project(':common').sourceSets.main.java.srcDirs
        sourceSets.main.resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs
    }

    tasks.withType(Jar).configureEach {
        def dontCompileClasses = provider {
            def set = [] as Set
            sourceSets.main.java.srcDirs.each { File srcDir ->
                if (srcDir.exists()) {
                    srcDir.eachFileRecurse { File file ->
                        if (file.name.endsWith('.java') && file.text.contains('@DontCompile')) {
                            String rel = srcDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                            set.add(rel.substring(0, rel.length() - 5))
                        }
                    }
                }
            }
            return set
        }
        exclude { element ->
            if (element.name.endsWith('.class')) {
                String path = element.path.replace('\\', '/')
                return dontCompileClasses.get().any { prefix -> path.startsWith(prefix + '.') || path.startsWith(prefix + '$') }
            }
            return false
        }
    }

    tasks.named('processResources', ProcessResources).configure {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        if (project.name == 'forge') {
            exclude 'fabric.mod.json'
            exclude 'quilt.mod.json'
            exclude 'META-INF/neoforge.mods.toml'
        }
        if (project.name == 'neoforge') {
            exclude 'fabric.mod.json'
            exclude 'quilt.mod.json'
            exclude 'META-INF/mods.toml'
        }
        if (project.name == 'fabric') {
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/neoforge.mods.toml'
            exclude 'pack.mcmeta'
        }
    }
}

tasks.register('cleanLibs') {
    group = 'build'
    doLast {
        delete rootProject.layout.buildDirectory.dir("libs")
        subprojects.each { subproject ->
            delete subproject.layout.buildDirectory.dir("libs")
        }
    }
}

tasks.register('compileAll') {
    group = 'build'
    description = 'Cleans, builds all OS variants (via buildAllOs), and aggregates output release & dev JARs'
    dependsOn cleanLibs

    subprojects.each { subproject ->
        if (subproject.name != 'common') {
            def multiOsTask = subproject.tasks.findByName('buildAllOs')
            def fallbackTask = subproject.tasks.findByName('build')
            if (multiOsTask) {
                dependsOn multiOsTask
            } else if (fallbackTask) {
                dependsOn fallbackTask
            }
        } else {
            dependsOn subproject.tasks.named('build')
        }
    }

    doLast {
        def modDir = layout.buildDirectory.dir("libs/mod").get().asFile
        def devDir = layout.buildDirectory.dir("libs/dev").get().asFile
        modDir.mkdirs()
        devDir.mkdirs()

        def osSuffixes = ['-win.jar', '-linux.jar', '-macos.jar']

        ['fabric', 'forge', 'neoforge'].each { platform ->
            def subProj = findProject(":${platform}")
            if (subProj != null) {
                def buildLibs = subProj.layout.buildDirectory.dir("libs").get().asFile
                if (buildLibs.exists()) {
                    buildLibs.listFiles().each { jarFile ->
                        if (jarFile.name.endsWith(".jar")) {
                            def name = jarFile.name
                            if (name.contains("-dev")) {
                                copy { from jarFile; into devDir }
                            } else if (osSuffixes.any { name.endsWith(it) }) {
                                copy { from jarFile; into modDir }
                            }
                        }
                    }
                }
            }
        }

        def commonProj = findProject(":common")
        if (commonProj != null) {
            def commonLibs = commonProj.layout.buildDirectory.dir("libs").get().asFile
            if (commonLibs.exists()) {
                commonLibs.listFiles().each { jarFile ->
                    if (jarFile.name.endsWith(".jar") &&
                            !jarFile.name.startsWith("common-") &&
                            !jarFile.name.contains("-sources") &&
                            !jarFile.name.contains("-javadoc")) {
                        copy {
                            from jarFile
                            into devDir
                        }
                    }
                }
            }
        }
    }
}
