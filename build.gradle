buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:${project.mixingradle_version}"
    }
}

ext {
    getOsClassifier = {
        def os = System.getProperty("os.name").toLowerCase()
        def arch = System.getProperty("os.arch").toLowerCase()
        def isArm = arch.contains("arm") || arch.contains("aarch64")
        if (os.contains("win")) return "windows-x86_64"
        if (os.contains("mac")) return isArm ? "macosx-arm64" : "macosx-x86_64"
        if (os.contains("nix") || os.contains("nux") || os.contains("aix")) return isArm ? "linux-arm64" : "linux-x86_64"
        return "linux-x86_64"
    }
    getOsSuffix = {
        if (project.hasProperty('os')) {
            return project.property('os')
        }
        def os = System.getProperty("os.name").toLowerCase()
        if (os.contains("win")) return "win"
        if (os.contains("mac")) return "macos"
        if (os.contains("nix") || os.contains("nux")) return "linux"
        return "unknown"
    }
    javacvVersion = "1.5.10"
    ffmpegVersion = "6.1.1-${javacvVersion}"

    modProperties = [
            version: project.mod_version,
            loader_version: project.fabric_loader_version,
            minecraft_version: project.minecraft_version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_description: project.mod_description,
            mod_authors: project.mod_authors,
            mod_license: project.mod_license,
            mod_homepage: project.mod_homepage,
            mod_issues: project.mod_issues ?: '',
            mod_icon: project.mod_icon,
            forge_version: project.findProperty('forge_version') ?: '',
            neoforge_version: project.findProperty('neoforge_version') ?: ''
    ]
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    def javaVer = Integer.parseInt(project.findProperty('java_version') ?: '17')
    java {
        sourceCompatibility = JavaVersion.toVersion(javaVer)
        targetCompatibility = JavaVersion.toVersion(javaVer)
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVer)
        }
    }

    version = project.mod_version
    group = project.maven_group
}

subprojects {
    def javaVer = Integer.parseInt(project.findProperty('java_version') ?: '17')

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaVer
    }

    tasks.named('processResources', ProcessResources).configure {
        def props = rootProject.ext.find('modProperties') ?: [:]
        inputs.properties props
        duplicatesStrategy = DuplicatesStrategy.WARN

        if (project.name == 'forge') {
            exclude 'fabric.mod.json', 'quilt.mod.json', 'META-INF/neoforge.mods.toml'
        } else if (project.name == 'neoforge') {
            exclude 'fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml'
        } else if (project.name == 'fabric') {
            exclude 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta'
        }
    }

    configurations {
        embed
        implementation.extendsFrom(embed)
    }

    if (project.name != 'common') {
        evaluationDependsOn(':common')
        def commonProject = project(':common')
        sourceSets.main.java.srcDirs = [commonProject.sourceSets.main.java.srcDirs, sourceSets.main.java.srcDirs].flatten()
        sourceSets.main.resources.srcDirs = [commonProject.sourceSets.main.resources.srcDirs, sourceSets.main.resources.srcDirs].flatten()
    }

    repositories {
        mavenCentral()
        if (project.hasProperty('aslib_version') && project.aslib_version) {
            maven { url = 'https://raw.githubusercontent.com/Akfz/AsLib/maven/' }
        }
        if (project.hasProperty('dbuild_version') && project.dbuild_version) {
            maven { url = 'https://raw.githubusercontent.com/Akfz/DBuild/maven/' }
        }
    }

    dependencies {
        if (project.hasProperty('aslib_version') && project.aslib_version) {
            def aslibDep = "v.akfz:aslib-${project.name}:${project.aslib_version}"

            if (project.configurations.findByName('modImplementation')) {
                modImplementation aslibDep
            } else {
                implementation aslibDep
            }

            annotationProcessor aslibDep
        }

        if (project.hasProperty('dbuild_version') && project.dbuild_version) {
            def dbuildDep = "v.akfz:DBuild:${project.dbuild_version}"
            compileOnly dbuildDep
            annotationProcessor dbuildDep
        }

        compileOnly "org.bytedeco:javacv:${rootProject.ext.javacvVersion}"
        compileOnly "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}"

        if (project.name != 'common') {
            def osClassifier = rootProject.ext.getOsClassifier()
            implementation "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:${osClassifier}"
            implementation "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:${osClassifier}"
        }
    }

    tasks.withType(Jar).configureEach {
        def dontCompileClasses = provider {
            def excludedPrefixes = [] as Set
            sourceSets.main.java.srcDirs.each { File srcDir ->
                if (srcDir.exists()) {
                    srcDir.eachFileRecurse { File file ->
                        if (file.name.endsWith('.java')) {
                            boolean found = false
                            file.eachLine('UTF-8') { line ->
                                if (line =~ /\b@DontCompile\b/) {
                                    found = true
                                    return false
                                }
                            }
                            if (found) {
                                String rel = srcDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                                excludedPrefixes.add(rel.substring(0, rel.length() - 5))
                            }
                        }
                    }
                }
            }
            return excludedPrefixes
        }

        exclude { element ->
            if (element.name.endsWith('.class')) {
                String path = element.path.replace('\\', '/')
                return dontCompileClasses.get().any { prefix ->
                    path.startsWith(prefix + '.') || path.startsWith(prefix + '$') || path == (prefix + '.class')
                }
            }
            return false
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                def osSuffix = rootProject.getOsSuffix()
                artifactId = "${project.archives_base_name}-${project.name}-${osSuffix}"

                if (project.name == 'fabric') {
                    artifact jar
                    artifact sourcesJar
                } else if (project.name == 'forge' || project.name == 'neoforge') {
                    artifact jar
                    artifact sourcesJar
                } else {
                    artifact jar
                    artifact sourcesJar
                }
            }
        }
        repositories {
            maven {
                name = "TargetMaven"
                def pubDir = project.findProperty('publishing-dir')
                if (pubDir) {
                    url = rootProject.file(pubDir)
                } else {
                    url = uri(rootProject.layout.buildDirectory.dir("repo"))
                }
            }
        }
    }
}

tasks.register('cleanLibs') {
    group = 'build'
    description = 'Cleans only the libs directories of root and subprojects'
    doLast {
        delete rootProject.layout.buildDirectory.dir("libs")
        subprojects.each { delete it.layout.buildDirectory.dir("libs") }
    }
}

tasks.register('compileAll') {
    group = 'build'
    description = 'Cleans libs, builds all OS variants, and aggregates output release & dev JARs'
    dependsOn 'cleanLibs'

    subprojects.each { subproject ->
        if (subproject.name != 'common') {
            def multiOsTask = subproject.tasks.findByName('buildAllOs')
            def fallbackTask = subproject.tasks.findByName('build')
            if (multiOsTask) {
                dependsOn multiOsTask
            } else if (fallbackTask) {
                dependsOn fallbackTask
            }
        } else {
            dependsOn subproject.tasks.named('build')
        }
    }

    doLast {
        def modDir = layout.buildDirectory.dir("libs/mod").get().asFile
        def devDir = layout.buildDirectory.dir("libs/dev").get().asFile
        modDir.mkdirs()
        devDir.mkdirs()

        def osSuffixes = ['-win.jar', '-linux.jar', '-macos.jar']

        ['fabric', 'forge', 'neoforge'].each { platform ->
            def subProj = findProject(":${platform}")
            if (subProj != null) {
                def buildLibs = subProj.layout.buildDirectory.dir("libs").get().asFile
                if (buildLibs.exists()) {
                    buildLibs.listFiles()?.each { jarFile ->
                        if (jarFile.name.endsWith(".jar")) {
                            def name = jarFile.name
                            if (name.contains("-dev")) {
                                copy { from jarFile; into devDir }
                            } else if (osSuffixes.any { name.endsWith(it) } || name.contains("-${platform}.jar")) {
                                copy { from jarFile; into modDir }
                            }
                        }
                    }
                }
            }
        }
    }
}