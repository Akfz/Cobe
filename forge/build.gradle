plugins {
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
    id 'org.spongepowered.mixin'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

configurations {
    bundleCore
    bundleWin
    bundleLinux
    bundleMac
}

minecraft {
    def pVer = project.findProperty('parchment_version') ?: '2023.09.03'
    def pMc = project.findProperty('parchment_mc_version') ?: project.minecraft_version
    mappings channel: 'parchment', version: "${pVer}-${pMc}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.earlydisplay.enable', 'false'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
        client {
            property 'mixin.config', "${mixinConfigName}.json"
        }
        server {
            property 'mixin.config', "${mixinConfigName}.json"
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', "${project.mod_id}", '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"

    def mixinExtrasVer = project.findProperty('mixinextras_version') ?: '0.4.1'
    embed "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVer}"

    bundleCore "org.bytedeco:javacv:${rootProject.ext.javacvVersion}"
    bundleWin "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:windows-x86_64"
    bundleWin "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:windows-x86_64"
    bundleLinux "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:linux-x86_64"
    bundleLinux "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:linux-x86_64"
    bundleMac "org.bytedeco:javacpp:${rootProject.ext.javacvVersion}:macosx-x86_64"
    bundleMac "org.bytedeco:ffmpeg:${rootProject.ext.ffmpegVersion}:macosx-x86_64"
}

mixin {
    def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
    add sourceSets.main, "${mixinConfigName}.refmap.json"
    config "${mixinConfigName}.json"
}

tasks.named('processResources', ProcessResources).configure {
    def props = rootProject.ext.find('modProperties') ?: [:]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '**/*.json']) {
        expand props
    }
    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.named('jar', Jar).configure {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-forge.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.WARN

    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.maven_group,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : project.maven_group,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mixinConfigName}.json"
        ])
    }
}

tasks.register('devJar', Jar) {
    archiveFileName.set("${project.archives_base_name}-${project.mod_version}-forge-dev.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    duplicatesStrategy = DuplicatesStrategy.WARN

    from sourceSets.main.output
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        def mixinConfigName = project.findProperty('mixin_name') ?: project.mod_id
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.maven_group,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : project.maven_group,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mixinConfigName}.json"
        ])
    }
}

def createMultiOsJar = { String targetOsSuffix, String configName ->
    tasks.register("buildJar${targetOsSuffix.capitalize()}", Jar) {
        dependsOn tasks.jar
        group = 'build'
        description = "Собирает Forge JAR с встроенными библиотеками для ${targetOsSuffix}"
        archiveFileName.set("${project.archives_base_name}-${project.mod_version}-forge-${targetOsSuffix}.jar")
        destinationDirectory.set(layout.buildDirectory.dir("libs"))
        duplicatesStrategy = DuplicatesStrategy.WARN

        from(zipTree(tasks.jar.archiveFile)) {
            exclude 'META-INF/MANIFEST.MF'
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.DSA'
            exclude 'META-INF/*.RSA'
        }
        from {
            (configurations.getByName(configName) + configurations.bundleCore).collect {
                it.isDirectory() ? it : zipTree(it)
            }
        }
        manifest {
            attributes(tasks.jar.manifest.attributes)
        }
    }
}

createMultiOsJar('win', 'bundleWin')
createMultiOsJar('linux', 'bundleLinux')
createMultiOsJar('macos', 'bundleMac')

tasks.register('buildAllOs') {
    group = 'build'
    dependsOn 'buildJarWin', 'buildJarLinux', 'buildJarMacos', 'devJar'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-AmodLoaderTarget=forge"
}